name: amongus-lfg-app

services:
  - name: api-server
    git:
      repo: among-app/among-app.git # あなたのリポジトリ名に修正してください
      branch: main
    docker:
      dockerfile: Dockerfile
    instance_type: free
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000

databases:
  - name: amongus-lfg-db
    engine: postgres
    instance_type: free
